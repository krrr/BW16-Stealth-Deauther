[env:bw16]
platform = file://lib/ameba-arduino-d-feature-platformio-support/platformio/platform-amebad
framework = arduino

platform_packages =
    framework-arduinoamebad @ symlink://lib/ameba-arduino-d-feature-platformio-support

monitor_speed = 115200
upload_speed = 1500000
board = rtl8720dn_bw16
# flash总大小
board_build.flash_size = 2MB
# 1MB OTA slot
board_upload.maximum_size = 1024000

upload_port = COM6
monitor_port = COM6

lib_extra_dirs =
    lib/ameba-arduino-d-feature-platformio-support/Arduino_package/hardware/libraries

lib_deps =
    ArduinoJson@7.4.3

build_flags =
    -Ilib/ameba-arduino-d-feature-platformio-support/Arduino_package/hardware/libraries/WiFi/src

extra_scripts =
    post:scripts/make_ota_bin.py